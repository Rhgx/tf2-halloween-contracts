# Pushing a tag like v2.0.0 builds the Windows installer and the portable exe and attaches both to a GitHub release
# for that tag. Windows only for now (see README).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          # No dependency cache here: a release should build from a clean install, not a restored cache.
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run typecheck
      - run: npm run tauri build
      - run: cargo test --release
        working-directory: src-tauri
      - name: Create the release
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe
          gh release create "$env:GITHUB_REF_NAME" $installer.FullName src-tauri/target/release/tf2-halloween-utils.exe --title "$env:GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
